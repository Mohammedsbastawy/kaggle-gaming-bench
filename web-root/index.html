<!-- 7BZ Dev Cloud Game: Keyboard Lock – prevents Esc from exiting browser fullscreen -->
<script>
(function(){
  var _kl=false;
  function _lock(){
    if(document.fullscreenElement && navigator.keyboard && navigator.keyboard.lock){
      navigator.keyboard.lock(['Escape']).then(function(){_kl=true;
        console.log('[GameLab] Keyboard locked – Esc captured for gaming');
      }).catch(function(e){console.log('[GameLab] Keyboard lock:',e.message);});
    }
  }
  document.addEventListener('fullscreenchange',function(){
    if(document.fullscreenElement){_lock();}
    else if(_kl && navigator.keyboard && navigator.keyboard.unlock){navigator.keyboard.unlock();_kl=false;}
  });
  _lock();
})();
</script>
